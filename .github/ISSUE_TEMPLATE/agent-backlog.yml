name: Agent backlog
description: Low-risk, bounded engineering work suitable for a background agent
title: '[agent] '
labels:
  - agent-backlog
  - agent:weak
  - risk:low
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete issue was discovered?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: What should be true after this work is merged?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Keep these bounded and mechanically verifiable when possible.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files / area
      description: Known paths or the smallest repository area to inspect.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Decisions or adjacent work this background task must not absorb.
  - type: dropdown
    id: effort
    attributes:
      label: Effort
      description: Also add the matching effort:xs, effort:s, or effort:m label manually.
      options:
        - xs
        - s
        - m
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Fingerprint
      description: Optional triage correlation key. Server deduplication reads only its ops-fingerprint HTML comment, written by ops_backlog_create.
