name: Setup workspace
description: Install the shared Node, pnpm, Python, and optional Playwright toolchain.

inputs:
  uv:
    description: Install uv for analytics-engine tasks.
    default: 'true'
  playwright-browsers:
    description: Restore and install the Playwright Chromium browser.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install uv
      if: inputs.uv == 'true'
      uses: astral-sh/setup-uv@v5
      with:
        version: '0.8.13'
        enable-cache: true
        cache-dependency-glob: apps/analytics-engine/uv.lock

    - name: Cache Playwright browsers
      if: inputs.playwright-browsers == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('apps/app/package.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install workspace dependencies
      shell: bash
      env:
        HUSKY: '0'
        PLAYWRIGHT_SKIP_INSTALL: ${{ inputs.playwright-browsers == 'true' && '0' || '1' }}
      run: pnpm install --frozen-lockfile
