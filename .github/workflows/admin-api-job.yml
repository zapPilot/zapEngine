name: Admin API job

# The scheduled account-engine maintenance jobs differ only in when they run and
# which endpoint they hit, so the runner, the timeout, the missing-key guard and
# the retrying curl live here once.
on:
  workflow_call:
    inputs:
      url:
        description: Admin API endpoint to POST to.
        required: true
        type: string

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      TARGET_URL: ${{ inputs.url }}
    steps:
      - name: POST ${{ inputs.url }}
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "ADMIN_API_KEY is not configured" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST "$TARGET_URL" \
            --header "x-api-key: $ADMIN_API_KEY"
