name: Alpha ETL Daily Refresh

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-etl-daily-refresh
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPHA_ETL_WEBHOOK_SECRET: ${{ secrets.ALPHA_ETL_WEBHOOK_SECRET }}
      ALPHA_ETL_JOBS_URL: https://alpha-etl.fly.dev/webhooks/jobs
    steps:
      - name: Enqueue six-source daily refresh
        run: |
          set -euo pipefail

          if [ -z "$ALPHA_ETL_WEBHOOK_SECRET" ]; then
            echo "ALPHA_ETL_WEBHOOK_SECRET is not configured" >&2
            exit 1
          fi

          enqueue_response=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST "$ALPHA_ETL_JOBS_URL" \
            --header "Authorization: Bearer $ALPHA_ETL_WEBHOOK_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}')
          job_id=$(jq -er '.data.jobId | select(type == "string" and length > 0)' <<< "$enqueue_response")

          echo "Enqueued Alpha ETL job $job_id"

          for attempt in $(seq 1 60); do
            status_response=$(curl --silent --show-error \
              --retry 3 --retry-all-errors \
              --write-out $'\n%{http_code}' \
              "$ALPHA_ETL_JOBS_URL/$job_id")
            response_body=${status_response%$'\n'*}
            http_code=${status_response##*$'\n'}

            if [ "$http_code" = "404" ]; then
              echo "Alpha ETL job $job_id was not found" >&2
              exit 1
            fi

            if [[ "$http_code" != 2* ]]; then
              echo "Alpha ETL job status request failed with HTTP $http_code" >&2
              echo "$response_body" >&2
              exit 1
            fi

            status=$(jq -er '.data.status | select(type == "string")' <<< "$response_body")
            echo "Poll $attempt/60: $status"

            case "$status" in
              completed)
                exit 0
                ;;
              failed)
                echo "Alpha ETL job $job_id failed" >&2
                echo "$response_body" >&2
                exit 1
                ;;
              pending|processing)
                ;;
              *)
                echo "Alpha ETL job $job_id returned unknown status: $status" >&2
                exit 1
                ;;
            esac

            if [ "$attempt" -lt 60 ]; then
              sleep 15
            fi
          done

          echo "Timed out waiting for Alpha ETL job $job_id" >&2
          exit 1
