name: Alpha ETL Daily Refresh

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-etl-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ALPHA_ETL_WEBHOOK_SECRET: ${{ secrets.ALPHA_ETL_WEBHOOK_SECRET }}
      ALPHA_ETL_JOBS_URL: https://alpha-etl.fly.dev/webhooks/jobs

    steps:
      - name: Run daily ETL and wait for completion
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$ALPHA_ETL_WEBHOOK_SECRET" ]; then
            echo "ALPHA_ETL_WEBHOOK_SECRET is not configured" >&2
            exit 1
          fi

          response="$(
            curl --fail-with-body --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --request POST "$ALPHA_ETL_JOBS_URL" \
              --header "Authorization: Bearer $ALPHA_ETL_WEBHOOK_SECRET" \
              --header "Content-Type: application/json" \
              --data '{}'
          )"

          job_id="$(echo "$response" | jq -r '.data.jobId // empty')"

          if [ -z "$job_id" ]; then
            echo "ETL enqueue response did not contain jobId:"
            echo "$response"
            exit 1
          fi

          echo "ETL job queued: $job_id"

          status_url="$ALPHA_ETL_JOBS_URL/$job_id"

          while true; do
            body_file="$(mktemp)"

            http_status="$(
              curl --silent --show-error \
                --output "$body_file" \
                --write-out '%{http_code}' \
                "$status_url"
            )"

            body="$(cat "$body_file")"
            rm -f "$body_file"

            status="$(echo "$body" | jq -r '.data.status // empty')"

            echo "ETL job $job_id: HTTP $http_status · $status"

            case "$http_status" in
              200)
                echo "$body" | jq .
                echo "Daily ETL completed successfully."
                exit 0
                ;;

              202)
                sleep 10
                ;;

              *)
                echo "Daily ETL failed or partially completed:"
                echo "$body" | jq . || echo "$body"
                exit 1
                ;;
            esac
          done