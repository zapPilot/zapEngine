name: Branch env manifest refresh

on:
  push:
    branches:
      - feat/ops-mcp-investigation
    paths:
      - .github/workflows/branch-env-manifest-refresh.yml

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register Ops credentials in canonical env manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('config/env.manifest.mjs')
          text = path.read_text()
          needle = "  OPS_GITHUB_TOKEN: server(['control-center'], { sensitive: true }),\n  SENTRY_OPS_AUTH_TOKEN: server(['control-center'], { sensitive: true }),"
          replacement = "  OPS_GITHUB_TOKEN: server(['control-center'], { sensitive: true }),\n  FLY_OPS_TOKEN: server(['control-center'], { sensitive: true }),\n  OPS_MCP_TOKEN: server(['control-center'], { sensitive: true }),\n  SENTRY_OPS_AUTH_TOKEN: server(['control-center'], { sensitive: true }),"
          if needle not in text:
              raise SystemExit('expected Control Center Ops credential block not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- config/env.manifest.mjs; then
            echo "Manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/env.manifest.mjs
          git commit -m "Register Ops MCP and Fly credentials"
          git push origin HEAD:${GITHUB_REF_NAME}
