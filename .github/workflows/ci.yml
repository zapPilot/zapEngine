name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy a specific app or all apps
        required: true
        default: all
        type: choice
        options:
          - all
          - account-engine
          - alpha-etl
          - analytics-engine
          - podcast-pipeline

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # These jobs use grouped subsets of the same registry as `pnpm verify ci`.
  # If a job changes to `pnpm verify parallel`, restore checkout fetch-depth: 0
  # because the affected-range guard requires full history.
  quick-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Run quick gates
        run: bash scripts/verify-jobs.sh format repo contracts

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quick-gates-verify-${{ github.run_attempt }}
          path: .ai-verify/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Run code quality gates
        run: bash scripts/verify-jobs.sh type-check lint deadcode dup

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-verify-${{ github.run_attempt }}
          path: .ai-verify/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_READ_ONLY: 'true'
      # Snapshot gate (test:strategy-snapshot:fast) boots the FastAPI app and
      # reads alpha_raw.* via this URL. Point at the Supabase read-only replica.
      DATABASE_READ_ONLY_URL: ${{ secrets.DATABASE_READ_ONLY_URL }}
      # Pytest fixtures use these local URLs; do not point at production.
      TEST_DATABASE_URL: postgresql+psycopg://test_user:testpass123@localhost:5432/test_db
      DATABASE_INTEGRATION_URL: postgresql+asyncpg://test_user:testpass123@localhost:5432/test_db
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Run test gates
        run: bash scripts/verify-jobs.sh test analytics

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-verify-${{ github.run_attempt }}
          path: .ai-verify/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'
          playwright-browsers: 'true'

      - name: Run web E2E
        run: bash scripts/verify-jobs.sh e2e

      - name: Upload verification logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-verify-${{ github.run_attempt }}
          path: .ai-verify/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-playwright-failure-${{ github.run_attempt }}
          path: |
            apps/app/playwright-report
            apps/app/test-results
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Security audit (Node + Python)
        run: |
          mkdir -p .ai-verify/logs
          pnpm run security audit 2>&1 | tee .ai-verify/logs/security.log

      - name: Upload security audit log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-verify-${{ github.run_attempt }}
          path: .ai-verify/logs/security.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  deploy-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_matrix: ${{ steps.resolve.outputs.deploy_matrix }}
      verify_matrix: ${{ steps.resolve.outputs.verify_matrix }}
      app_ios: ${{ steps.filter.outputs.app_ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert dispatch options match .github/fly-apps.json
        run: bash scripts/check-dispatch-registry-drift.sh

      - name: Assert schedules match .github/schedules.json
        run: bash scripts/check-schedules-registry.sh

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            account-engine:
              - 'apps/account-engine/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'turbo.json'
              - '.dockerignore'
              - '.nvmrc'
            alpha-etl:
              - 'apps/alpha-etl/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'turbo.json'
              - '.dockerignore'
              - '.nvmrc'
            analytics-engine:
              - 'apps/analytics-engine/**'
              - '.dockerignore'
            podcast-pipeline:
              - 'apps/podcast-pipeline/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'turbo.json'
              - '.dockerignore'
              - '.nvmrc'
            app_ios:
              # Runtime/native inputs only. Tests, docs, lint config, and other
              # package-only QA changes are covered by the normal Linux gates
              # and must not trigger a full cold iOS Release compilation.
              - 'apps/app/src/**'
              - 'apps/app/assets/**'
              - 'apps/app/app.config.ts'
              - 'apps/app/babel.config.js'
              - 'apps/app/entrypoint.js'
              - 'apps/app/global.css'
              - 'apps/app/metro.config.js'
              - 'apps/app/package.json'
              - 'apps/app/tailwind.config.js'
              - 'apps/app/scripts/assert-ios-native-dependencies.cjs'
              - 'apps/app/scripts/assert-workspace-dist-fresh.cjs'
              - 'apps/app/scripts/ios-release-smoke.mjs'
              - 'apps/app/scripts/sync-ios-native.mjs'
              - 'apps/app/scripts/with-app-store-icon.cjs'
              - 'packages/app-core/src/**'
              - 'packages/app-core/package.json'
              - 'packages/design-tokens/src/**'
              - 'packages/design-tokens/package.json'
              - 'packages/design-tokens/tokens.json'
              - 'packages/intent-engine/src/**'
              - 'packages/intent-engine/package.json'
              - 'packages/types/src/**'
              - 'packages/types/package.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'turbo.json'
              - '.npmrc'
              - '.nvmrc'
              - '.github/actions/setup-workspace/**'
              - '.github/workflows/ci.yml'

      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
          PATHS_CHANGES: ${{ steps.filter.outputs.changes }}
        run: bash scripts/resolve-deploy-matrix.sh

  # Local equivalent:
  # `pnpm turbo run test:ios:release-smoke --filter=@zapengine/app`
  ios-release-smoke:
    needs: [deploy-gates]
    if: github.event_name == 'workflow_dispatch' || needs.deploy-gates.outputs.app_ios == 'true'
    runs-on: macos-26
    # A cold Expo/Pods Release compile can exceed 45 minutes on a fresh image.
    # The build step has its own tighter cap so diagnostics still have time to run.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'
        env:
          EAS_BUILD: 'true'
          HUSKY: '0'

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          pod --version
          xcrun simctl list runtimes

      - name: Build and cold-launch iOS Release
        id: ios_smoke
        timeout-minutes: 65
        run: >-
          pnpm turbo run test:ios:release-smoke
          --filter=@zapengine/app
          --log-order=stream

      - name: Show iOS smoke failure tail
        if: always() && steps.ios_smoke.outcome != 'success'
        run: |
          for log in \
            apps/app/test-results/ios-release-smoke/prebuild-and-pods.log \
            apps/app/test-results/ios-release-smoke/xcodebuild.log; do
            if [[ -f "$log" ]]; then
              echo "::group::$log (last 200 lines)"
              tail -n 200 "$log"
              echo "::endgroup::"
            fi
          done

      - name: Upload iOS smoke failure artifacts
        if: always() && steps.ios_smoke.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-release-smoke-${{ github.run_attempt }}
          path: apps/app/test-results/ios-release-smoke
          if-no-files-found: ignore
          retention-days: 7

  verify-fly-docker:
    needs: [deploy-gates]
    if: github.event_name == 'pull_request' && needs.deploy-gates.outputs.verify_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.deploy-gates.outputs.verify_matrix) }}
    uses: ./.github/workflows/verify-docker.yml
    with:
      app: ${{ matrix.app }}

  deploy-fly:
    # check-dead-env is a needs rather than an advisory job: the deploy now
    # re-asserts this app's environment, so shipping on a red env audit would
    # push the drift into production instead of only reporting it.
    needs:
      [
        quick-gates,
        code-quality,
        tests,
        e2e,
        security,
        deploy-gates,
        check-dead-env,
      ]
    if: github.event_name != 'pull_request' && needs.deploy-gates.outputs.deploy_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.deploy-gates.outputs.deploy_matrix) }}
    uses: ./.github/workflows/deploy-fly.yml
    with:
      app: ${{ matrix.app }}
      fly_config: ${{ matrix.fly_config }}
      verify_package_script: ${{ matrix.verify_package_script }}
      capture_release_metadata: ${{ matrix.capture_release_metadata }}
    secrets:
      fly_token: ${{ secrets[matrix.secret_name] }}
      env_fly_token: ${{ secrets.FLY_API_TOKEN }}
      expo_token: ${{ secrets.EXPO_TOKEN }}
      vercel_token: ${{ secrets.VERCEL_TOKEN }}
      infisical_client_id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      infisical_client_secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      infisical_project_id: ${{ secrets.INFISICAL_PROJECT_ID }}

  # Local equivalent: `pnpm lint dead-env`. The shared script also audits the
  # developer's root .env when present; CI checks source against the committed
  # manifest and verifies that committed values contain no secrets.
  check-dead-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Check env registry drift
        run: pnpm lint dead-env && pnpm env:status --offline

  # Local equivalent: `pnpm coverage summary`.
  coverage:
    # Parallel to the core quality jobs. Aggregates per-workspace coverage into
    # a single coverage/summary.json. Each workspace's test:coverage command
    # enforces its configured absolute thresholds.
    #
    # Intentionally NOT part of verify:ci — frontend sharded coverage is
    # ~6 min on its own; keeping this in its own job preserves fast feedback
    # on the core quality jobs.
    #
    # Security note: only admin-controlled secrets/vars are referenced via
    # ${{ }}. No github.event.* user input is used in run: steps.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_READ_ONLY: 'true'
      DATABASE_READ_ONLY_URL: ${{ secrets.DATABASE_READ_ONLY_URL }}
      TEST_DATABASE_URL: postgresql+psycopg://test_user:testpass123@localhost:5432/test_db
      DATABASE_INTEGRATION_URL: postgresql+asyncpg://test_user:testpass123@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Self-test the coverage scripts
        run: pnpm run coverage test

      - name: Coverage summary (workspace thresholds)
        run: pnpm run coverage summary

      - name: Upload coverage summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload per-workspace HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            apps/*/coverage/**/*.html
            packages/*/coverage/**/*.html
          if-no-files-found: ignore
          retention-days: 7
