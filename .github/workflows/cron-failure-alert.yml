# Failure alerting has three deliberate limits: workflow_run matches workflow
# names, this workflow only runs from its default-branch version, and invalid
# workflow YAML can fail at startup without emitting a workflow_run event.
name: Cron Failure Alert

on:
  workflow_run:
    workflows:
      - Alpha ETL Daily Refresh
      - Backtest Refresh
      - Distribution Snapshot
      - Environment drift
      - Ops Cost Sync
      - Ops Operator
      - Strategy Change Broadcast
      - Telegram Token Cleanup
      - Track Record Snapshot
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate production environment rail credentials
        run: |
          missing=0
          for name in INFISICAL_UNIVERSAL_AUTH_CLIENT_ID \
            INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET INFISICAL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Authenticate Infisical machine identity
        run: |
          npm install --global @infisical/cli@0.43.125
          token="$(infisical login --method=universal-auth --silent --plain)"
          echo "::add-mask::$token"
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Notify operator via Telegram
        run: node scripts/env/run.mjs --environment prod -- node scripts/notify-cron-failure.mjs
