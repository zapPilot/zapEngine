name: Deploy to Fly.io

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
        description: >-
          App directory name (e.g., account-engine). Doubles as the
          `config/env.destinations.mjs` destination name reconciled before deploy.
      fly_config:
        type: string
        required: true
        description: Path to fly.toml (e.g., apps/account-engine/fly.toml).
      verify_package_script:
        type: string
        default: ''
        description: Optional root pnpm script (may include a subcommand, e.g. "verify deploy") to run before deploy. Skipped when empty.
      capture_release_metadata:
        type: boolean
        default: false
        description: If true, passes COMMIT_SHA + BUILD_TIME as --build-arg to flyctl deploy.
    secrets:
      fly_token:
        required: true
        description: Per-app deploy token. Used only by the deploy step.
      env_fly_token:
        required: true
        description: Fleet-wide FLY_API_TOKEN shared with the environment rails; needs secret-write scope.
      expo_token:
        required: true
      vercel_token:
        required: true
      infisical_client_id:
        required: true
      infisical_client_secret:
        required: true
      infisical_project_id:
        required: true

# The deploy stages the app's complete secret set before `fly deploy` consumes
# it. Keep that transient Fly state mutually exclusive with env-apply and the
# fleet-wide drift audit; otherwise env:status can observe legitimate `Staged`
# entries between those two steps and fail a healthy merge. Do not cancel a
# holder: interrupting after the stage step is exactly the state this rail is
# meant to prevent readers from observing.
concurrency:
  group: env-rail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fly-rollout-${{ inputs.app }}
      cancel-in-progress: false
    env:
      # `setup-env-tooling` fails unless all six credentials are present, so the
      # two this workflow never reads are still supplied. FLY_API_TOKEN here is
      # the fleet token used to stage secrets; the deploy step overrides it with
      # the app's own deploy token.
      EXPO_TOKEN: ${{ secrets.expo_token }}
      FLY_API_TOKEN: ${{ secrets.env_fly_token }}
      VERCEL_TOKEN: ${{ secrets.vercel_token }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.infisical_client_id }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.infisical_client_secret }}
      INFISICAL_PROJECT_ID: ${{ secrets.infisical_project_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      # Deliberately ahead of the env reconcile: a deploy that cannot pass its
      # own gate must not have written to the production secret store first.
      - name: Run verify script
        if: inputs.verify_package_script != ''
        env:
          VERIFY_SCRIPT: ${{ inputs.verify_package_script }}
        # VERIFY_SCRIPT may contain a subcommand (e.g. "verify deploy"); its value is
        # admin-controlled via .github/fly-apps.json, so intentional word-splitting is safe.
        run: pnpm run $VERIFY_SCRIPT

      # Also installs the flyctl the deploy step below calls. Note the action
      # SHA is pinned but the flyctl binary is not — it tracks latest.
      - uses: ./.github/actions/setup-env-tooling

      # Every code deploy reasserts this app's manifest so code cannot outrun a
      # required env value. Fly secret writes normally trigger their own rollout
      # using Fly's previously stored deployment config, which made a stale
      # bluegreen config capable of blocking podcast-pipeline before its new
      # rolling fly.toml could even be deployed. Stage the secrets instead: the
      # following fly deploy applies staged secrets + image + fly.toml together
      # in one rollout. Standalone env-apply remains immediate for env-only
      # changes and rotations.
      #
      # Apply-only on purpose: removals stay with the `env:sync --prune` in
      # env-apply.yml, whose dry run is reviewed on the pull request. A code
      # deploy must not prune the running release before the replacement exists.
      - name: Stage ${{ inputs.app }} environment for deploy
        env:
          TARGET: ${{ inputs.app }}
        run: pnpm env:sync --target "$TARGET" --apply --stage-fly

      - name: Capture release metadata
        if: inputs.capture_release_metadata
        id: release_metadata
        run: |
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.fly_token }}
          FLY_CONFIG: ${{ inputs.fly_config }}
          CAPTURE_RELEASE: ${{ inputs.capture_release_metadata }}
          COMMIT_SHA: ${{ steps.release_metadata.outputs.commit_sha }}
          BUILD_TIME: ${{ steps.release_metadata.outputs.build_time }}
        run: |
          args=(--config "$FLY_CONFIG")
          if [ "$CAPTURE_RELEASE" = "true" ]; then
            args+=(--commit-sha "$COMMIT_SHA" --build-time "$BUILD_TIME")
          fi
          node scripts/fly-deploy.mjs "${args[@]}"
