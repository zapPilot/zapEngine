name: Deploy Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    # Every completed CI run starts this workflow, including red runs whose
    # deploy job is skipped. Only a job that passes its `if` joins a job-level
    # group, so those skipped runs cannot cancel or displace a waiting green
    # deploy. A running deploy is never cancelled: its Vercel builds would keep
    # going and hold the team's single build slot ahead of the next deploy. The
    # default single pending slot still lets a newer green SHA replace an older
    # waiting one.
    concurrency:
      group: deploy-vercel-production
      cancel-in-progress: false
    # scripts/deploy-vercel-main.mjs gives up 25 minutes after creating the
    # deployments; the rest covers checkout and the last status poll.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy production Vercel projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/deploy-vercel-main.mjs
