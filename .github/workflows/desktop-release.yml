name: Desktop release
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment: desktop-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'
      - name: Check tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/desktop-release.mjs check-tag "$RELEASE_TAG"
      - uses: ./.github/actions/setup-env-tooling
        env:
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        with:
          fly: 'false'
          expo: 'false'
          vercel: 'false'
      - name: Bundle
        env:
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/desktop-release.mjs bundle
      - name: Sign
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          INFISICAL_TOKEN: ''
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/desktop-notary.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/desktop-notary.p8"
          node scripts/desktop-release.mjs sign
      - name: Verify
        run: node scripts/desktop-release.mjs verify
      - name: Checksums
        working-directory: apps/desktop/release
        run: shasum -a 256 Zap-Pilot-mac-arm64.dmg Zap-Pilot-mac-arm64.dmg.blockmap Zap-Pilot-mac-arm64.zip Zap-Pilot-mac-arm64.zip.blockmap latest-mac.yml > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: |
            apps/desktop/release/Zap-Pilot-mac-arm64.*
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/desktop-notary.p8"
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release
          path: desktop-release
      - name: Check checksums
        working-directory: desktop-release
        run: shasum -a 256 -c SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/desktop-publish.mjs "$RELEASE_TAG" --dir desktop-release
