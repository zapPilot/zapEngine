name: Distribution Snapshot

# Refreshes the committed distribution artifact behind the landing page's
# /distribution route: how many articles the content pipeline has taken in, and
# what came out per language and per platform. The page imports the JSON at
# build time, so the landing page never needs Supabase credentials of its own.

on:
  schedule:
    # 02:15 UTC — clear of both other jobs that push to the default branch
    # (track-record-snapshot at 00:00, backtest-refresh at 01:30), and after
    # the overnight social publishing window has been measured.
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: distribution-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Production application credentials come from the environment rail. Only
    # the machine identity and destination CLI credentials live in GitHub.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
      ARTIFACT: apps/landing-page/src/data/distribution-snapshot.json
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      - uses: ./.github/actions/setup-env-tooling

      # The generator skips with a warning and exit 0 when Supabase is not
      # configured, which is the right behaviour for a contributor but would
      # silently turn this job into a no-op. Validate inside the production env
      # rail so the check sees the Infisical-provided values.
      - name: Validate required credentials
        run: >-
          node scripts/env/run.mjs --environment prod -- node -e
          "const names=['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY'];
          const missing=names.filter((name)=>!process.env[name]);
          for (const name of missing) console.error(name+' is not configured');
          process.exit(missing.length ? 1 : 0)"

      - name: Record the committed post count
        run: |
          echo "PREVIOUS_POSTS=$(node -e "const s=require('./$ARTIFACT'); process.stdout.write(String(s.funnel.posts))")" >> "$GITHUB_ENV"

      # Run the package command directly under the env rail rather than through
      # turbo: turbo's strict env mode strips SUPABASE_* before the child starts.
      - name: Regenerate the distribution snapshot
        run: >-
          node scripts/env/run.mjs --environment prod --
          pnpm --filter @zapengine/podcast-pipeline social:distribution-snapshot

      - name: Format the refreshed artifact
        run: |
          pnpm --filter @zapengine/landing-page exec prettier --write \
            src/data/distribution-snapshot.json

      # Posts are never deleted, so the count can only grow. A drop means the
      # read was truncated or pointed somewhere else, and publishing it would
      # quietly shrink the public numbers.
      - name: Verify the snapshot did not shrink
        run: |
          posts="$(node -e "const s=require('./$ARTIFACT'); process.stdout.write(String(s.funnel.posts))")"
          if [ "$posts" -lt "$PREVIOUS_POSTS" ]; then
            echo "$ARTIFACT reports $posts posts, down from $PREVIOUS_POSTS — truncated read; refusing to publish." >&2
            exit 1
          fi
          echo "$posts posts (was $PREVIOUS_POSTS)."

      # The bot pushes with GITHUB_TOKEN, which does not trigger CI, so this is
      # the only gate the artifact passes before it is live. The landing suite
      # asserts the totals add up and that every platform and language the
      # artifact names is one the page can label.
      - name: Validate the refreshed artifact against the landing-page test suite
        run: pnpm turbo run test --filter=@zapengine/landing-page

      - name: Record the snapshot timestamp
        run: |
          echo "AS_OF=$(node -e "const s=require('./$ARTIFACT'); process.stdout.write(s.asOf)")" >> "$GITHUB_ENV"

      - name: Commit the refreshed distribution snapshot
        uses: ./.github/actions/commit-generated-artifacts
        with:
          paths: ${{ env.ARTIFACT }}
          message: Refresh distribution snapshot to ${{ env.AS_OF }}
