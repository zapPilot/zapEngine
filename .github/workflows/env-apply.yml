name: Environment apply

# Merging main is the only automatic writer of deployment environment state.
# `env:sync` is declarative rather than a diff, so it is safe to reassert the
# whole manifest on every run, and rotated Infisical secrets reach production
# through a workflow_dispatch of this same rail instead of a second mechanism.
on:
  push:
    branches: [main]
    paths:
      - config/env/**
      - config/env.manifest.mjs
      - config/env.destinations.mjs
      - scripts/env/**
  workflow_dispatch:
    inputs:
      target:
        description: Destination to apply, or every destination.
        type: choice
        default: all
        options:
          - all
          - account-engine
          - alpha-etl
          - analytics-engine
          - control-center-vercel
          - expo
          - landing-page
          - podcast-pipeline
          - web
      dry_run:
        description: List the SET/UNSET keys without writing to any store.
        type: boolean
        default: false

permissions:
  contents: read

# Serialized instead of cancelled: a cancelled run would leave the fleet
# half-applied. GitHub's default concurrency queue keeps only one pending run,
# so queue every waiter explicitly; the latest manifest still wins naturally as
# each queued run checks out its own triggering SHA. The group is shared with
# deploy-fly and the drift audit so reads never overlap writes.
concurrency:
  group: env-rail
  cancel-in-progress: false
  queue: max

jobs:
  apply:
    concurrency:
      group: fly-rollout-${{ matrix.target }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    # Podcast env writes can restart both process groups, so they use the same
    # 100-minute drain budget as code deploys plus rollout headroom.
    timeout-minutes: ${{ matrix.target == 'podcast-pipeline' && 150 || 15 }}
    strategy:
      # One expired platform token must not stop the other destinations from
      # converging on the merged manifest.
      fail-fast: false
      matrix:
        # Keep in step with DESTINATION_NAMES in config/env.destinations.mjs and
        # with the dispatch options above. A destination missing here still gets
        # caught by the verify job's fleet-wide audit.
        target: >-
          ${{ fromJSON((github.event_name == 'push' || github.event.inputs.target == 'all')
          && '["account-engine","alpha-etl","analytics-engine","control-center-vercel","expo","landing-page","podcast-pipeline","web"]'
          || format('["{0}"]', github.event.inputs.target)) }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/setup-env-tooling

      - name: Drain podcast render fleet
        if: matrix.target == 'podcast-pipeline' && github.event.inputs.dry_run != 'true'
        id: podcast_drain
        run: |
          deployment_id="$(node -e "console.log(require('node:crypto').randomUUID())")"
          owner_token="$(node -e "console.log(require('node:crypto').randomUUID())")"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "owner_token=$owner_token" >> "$GITHUB_OUTPUT"
          node scripts/env/run.mjs --environment prod -- \
            node scripts/podcast-deployment-gate.mjs prepare \
            --deployment-id "$deployment_id" \
            --owner-token "$owner_token" \
            --release "$GITHUB_SHA"

      - name: Authorize podcast env rollout
        if: matrix.target == 'podcast-pipeline' && github.event.inputs.dry_run != 'true'
        run: |
          node scripts/env/run.mjs --environment prod -- \
            node scripts/podcast-deployment-gate.mjs mark-rollout \
            --deployment-id "${{ steps.podcast_drain.outputs.deployment_id }}" \
            --owner-token "${{ steps.podcast_drain.outputs.owner_token }}"

      - name: Sync ${{ matrix.target }}
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            pnpm env:sync --target "$TARGET"
          else
            pnpm env:sync --target "$TARGET" --apply --prune
          fi

      - name: Reopen podcast claims
        if: matrix.target == 'podcast-pipeline' && github.event.inputs.dry_run != 'true'
        run: |
          node scripts/env/run.mjs --environment prod -- \
            node scripts/podcast-deployment-gate.mjs complete \
            --deployment-id "${{ steps.podcast_drain.outputs.deployment_id }}" \
            --owner-token "${{ steps.podcast_drain.outputs.owner_token }}"

      - name: Fence failed podcast env rollout
        if: ${{ always() && matrix.target == 'podcast-pipeline' && github.event.inputs.dry_run != 'true' && failure() && steps.podcast_drain.outputs.deployment_id != '' }}
        continue-on-error: true
        run: |
          node scripts/env/run.mjs --environment prod -- \
            node scripts/podcast-deployment-gate.mjs fail \
            --deployment-id "${{ steps.podcast_drain.outputs.deployment_id }}" \
            --owner-token "${{ steps.podcast_drain.outputs.owner_token }}" \
            --reason "Environment apply did not complete cleanly"

  # The 2026-08 render outage was two Fly secrets going missing without a single
  # red signal. Applying and then auditing in the same workflow makes the fleet
  # failing to converge a failed run on main rather than a next-day discovery.
  verify:
    needs: apply
    if: github.event.inputs.dry_run != 'true'
    uses: ./.github/workflows/env-status.yml
    secrets: inherit
