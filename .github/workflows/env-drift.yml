name: Environment drift

# Audit only. Pushes to main are covered by env-apply, which verifies the fleet
# right after it writes; running this at the same time would race that apply and
# report drift the apply was in the middle of fixing. What is left here is
# drift this repository did not cause: a value changed straight on a platform.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Shared with env-apply: auditing while a rail is writing reports drift that is
# already being fixed.
concurrency:
  group: env-rail
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/setup-env-tooling

      - name: Check all environment destinations
        run: pnpm env:status
