name: Environment drift

# Audit only. Pushes to main are covered by env-apply, which verifies the fleet
# right after it writes; running this at the same time would race that apply and
# report drift the apply was in the middle of fixing. What is left here is
# drift this repository did not cause: a value changed straight on a platform.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Shared with env-apply and deploy-fly: auditing while a rail is writing reports
# drift that is already being fixed. Keep all waiters instead of GitHub's
# default single pending slot, which silently replaces an older pending run.
concurrency:
  group: env-rail
  cancel-in-progress: false
  queue: max

jobs:
  status:
    uses: ./.github/workflows/env-status.yml
    secrets: inherit
