name: Ops Cost Sync

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-cost-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_COST_MODE: flyctl
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1 / 1.6

      - name: Validate required credentials
        run: |
          missing=0
          for name in FLY_API_TOKEN \
            INFISICAL_UNIVERSAL_AUTH_CLIENT_ID INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET \
            INFISICAL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Infisical CLI
        run: npm install --global @infisical/cli@0.43.125

      - name: Authenticate Infisical read-only identity
        run: |
          token="$(infisical login --method=universal-auth --silent --plain)"
          echo "::add-mask::$token"
          echo "INFISICAL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Collect and persist cost snapshots
        run: |
          infisical run --env=prod --projectId="$INFISICAL_PROJECT_ID" \
            -- pnpm ops:sync
