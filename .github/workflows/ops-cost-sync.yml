name: Ops Cost Sync

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-cost-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEBANK_API_KEY: ${{ secrets.DEBANK_API_KEY }}
      OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_COST_MODE: flyctl
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1 / 1.6

      - name: Validate required credentials
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY DEBANK_API_KEY OPENROUTER_MANAGEMENT_KEY FLY_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "$name is not configured" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Collect and persist cost snapshots
        run: pnpm ops:sync
