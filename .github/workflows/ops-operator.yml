name: Ops Operator
on:
  schedule:
    # Every four hours, off the top of the hour. GitHub runs schedules on a
    # best-effort basis and sheds more of them at :00; declared hourly, it still
    # delivered only about six runs a day. OPERATOR.md has the evidence and what
    # a tighter guarantee would need. Change the registry row and
    # OPS_OPERATOR_CADENCE_MS together with this line.
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ops-operator
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Server credentials arrive through the environment rail (Infisical prod).
    # This job never reaches a Fly/EAS/Vercel destination: `run.mjs` imports
    # `sources.mjs`, never `remote.mjs`, and the operator reads Fly state via
    # the Machines API with FLY_OPS_TOKEN from that rail. Requiring the
    # destination tokens would let an unrelated rotation break the operator
    # loop, so only the Infisical machine identity is mandatory here.
    env:
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'
      - uses: ./.github/actions/setup-env-tooling
        with:
          fly: 'false'
          expo: 'false'
          vercel: 'false'
      - run: pnpm turbo run build --filter=@zapengine/types
      - name: Observe and reconcile
        run: node scripts/env/run.mjs --environment prod -- pnpm --filter @zapengine/control-center ops:operator --allow-render-retry
