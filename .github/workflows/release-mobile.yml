name: Release mobile

# Manual only. EAS remote versioning increments versionCode/buildNumber on every
# build attempt — including failed ones — so a push-triggered release would burn
# store version numbers on each merge. The iOS App Version is resolved from App
# Store Connect on every run and pinned in the checkout; it is never committed.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - both
      mode:
        description: Build a new binary, submit an exact existing build, or both
        required: true
        default: build-and-submit
        type: choice
        options:
          - build-and-submit
          - build-only
          - submit-only
      android_build_id:
        description: Exact EAS Android build ID (required for submit-only when Android is selected)
        required: false
        type: string
      ios_build_id:
        description: Exact EAS iOS build ID (required for submit-only when iOS is selected)
        required: false
        type: string
      ios_version_policy:
        description: >-
          iOS App Version policy. auto: keep the open version, or bump the patch
          once Apple has closed it. keep: build the current version, fail if
          Apple closed it. bump-patch: always build the next patch version.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - keep
          - bump-patch

permissions:
  contents: read

# Keep one global release slot because remote auto-increment is shared mutable
# state. Exact build IDs remove the submission race, but concurrent builds would
# still consume version numbers unpredictably.
concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  gate:
    if: inputs.mode != 'submit-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      - name: Validate EAS toolchain config
        run: node apps/app/scripts/check-eas-toolchain.mjs

      - name: Run app workspace gate
        run: pnpm turbo run type-check lint test build --filter=@zapengine/app

      - name: Check formatting
        run: pnpm --filter @zapengine/app format:check

  build-android:
    needs: gate
    if: |
      always()
      && inputs.mode != 'submit-only'
      && contains(fromJSON('["android", "both"]'), inputs.platform)
      && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      - id: build
        name: Build Android on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm --filter @zapengine/app android:release

  build-ios:
    needs: gate
    if: |
      always()
      && inputs.mode != 'submit-only'
      && contains(fromJSON('["ios", "both"]'), inputs.platform)
      && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ios-release
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      - id: build
        name: Resolve iOS App Version and build on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IOS_VERSION_POLICY: ${{ inputs.ios_version_policy }}
        run: |
          umask 077
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            trap 'rm -f "$key_path"' EXIT
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
            export APPLE_API_KEY="$key_path"
          fi
          unset APPLE_API_KEY_P8
          pnpm --filter @zapengine/app ios:release --policy "$IOS_VERSION_POLICY"

  submit-android:
    needs: [gate, build-android]
    if: |
      always()
      && inputs.mode != 'build-only'
      && contains(fromJSON('["android", "both"]'), inputs.platform)
      && contains(fromJSON('["success", "skipped"]'), needs.gate.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build-android.result)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      - id: target
        name: Resolve exact Android build ID
        env:
          MODE: ${{ inputs.mode }}
          BUILT_ID: ${{ needs.build-android.outputs.build_id }}
          INPUT_ID: ${{ inputs.android_build_id }}
        run: |
          if [[ "$MODE" == "submit-only" ]]; then
            build_id="$INPUT_ID"
          else
            build_id="$BUILT_ID"
          fi
          if [[ -z "$build_id" ]]; then
            echo "error: an exact Android EAS build ID is required" >&2
            exit 1
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Submit exact Android build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.target.outputs.build_id }}
        run: pnpm --filter @zapengine/app android:submit "$BUILD_ID"

  submit-ios:
    needs: [gate, build-ios]
    if: |
      always()
      && inputs.mode != 'build-only'
      && contains(fromJSON('["ios", "both"]'), inputs.platform)
      && contains(fromJSON('["success", "skipped"]'), needs.gate.result)
      && contains(fromJSON('["success", "skipped"]'), needs.build-ios.result)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace
        with:
          uv: 'false'

      - id: target
        name: Resolve exact iOS build ID
        env:
          MODE: ${{ inputs.mode }}
          BUILT_ID: ${{ needs.build-ios.outputs.build_id }}
          INPUT_ID: ${{ inputs.ios_build_id }}
        run: |
          if [[ "$MODE" == "submit-only" ]]; then
            build_id="$INPUT_ID"
          else
            build_id="$BUILT_ID"
          fi
          if [[ -z "$build_id" ]]; then
            echo "error: an exact iOS EAS build ID is required" >&2
            exit 1
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Submit exact iOS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.target.outputs.build_id }}
        run: pnpm --filter @zapengine/app ios:submit "$BUILD_ID"
