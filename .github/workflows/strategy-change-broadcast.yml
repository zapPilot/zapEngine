name: Strategy Change Broadcast

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategy-change-broadcast
  cancel-in-progress: false

jobs:
  enqueue:
    uses: ./.github/workflows/admin-api-job.yml
    with:
      url: https://account-engine.fly.dev/jobs/strategy-change/batch
    secrets: inherit
