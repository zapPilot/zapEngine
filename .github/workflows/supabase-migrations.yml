name: Supabase migrations

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrations.yml'
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  validate-local:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Start local Supabase database
        run: supabase db start

      - name: Rebuild from committed migrations
        run: supabase db reset --local --no-seed

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  detect-production-migrations:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      target_sha: ${{ steps.changes.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - id: changes
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

          parent_sha="$(git rev-parse "$TARGET_SHA^1" 2>/dev/null || true)"
          if [[ -z "$parent_sha" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$parent_sha" "$TARGET_SHA" -- supabase/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-production:
    needs: [detect-production-migrations]
    if: needs.detect-production-migrations.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect-production-migrations.outputs.target_sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Assert production credentials are configured
        shell: bash
        run: |
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key must be configured in the protected production GitHub Environment."
              exit 1
            fi
          done

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending production migrations
        run: supabase db push --dry-run

      - name: Apply pending production migrations
        run: supabase db push

      - name: Verify migration history
        run: supabase migration list
