name: Telegram Token Cleanup

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-token-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      TELEGRAM_TOKEN_CLEANUP_URL: https://account-engine.fly.dev/jobs/maintenance/telegram-token-cleanup
    steps:
      - name: Delete expired Telegram verification tokens
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "ADMIN_API_KEY is not configured" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST "$TELEGRAM_TOKEN_CLEANUP_URL" \
            --header "x-api-key: $ADMIN_API_KEY"
