name: Telegram Token Cleanup

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-token-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    uses: ./.github/workflows/admin-api-job.yml
    with:
      url: https://account-engine.fly.dev/jobs/maintenance/telegram-token-cleanup
    secrets: inherit
