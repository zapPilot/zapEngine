name: Test QA State

on:
  workflow_dispatch:
    inputs:
      records:
        description: JSON array emitted by scripts/agents/test-qa-state.mjs record.
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: test-qa-state
  cancel-in-progress: false
  queue: max

jobs:
  persist:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RECORDS: ${{ inputs.records }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download newest main state artifact
        run: |
          mkdir -p "$RUNNER_TEMP/test-qa-previous"
          pages="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
              -f name=test-qa-state \
              -f per_page=100 \
              --paginate \
              --slurp
          )"
          row="$(
            printf '%s' "$pages" | jq -r '
              [.[].artifacts[]
                | select(.expired == false)
                | select(.workflow_run.head_branch == "main")]
              | sort_by(.id)
              | last
              | if . == null then "" else [.id, .workflow_run.id] | @tsv end
            '
          )"
          if [ -z "$row" ]; then
            echo "No previous main test-qa-state artifact; starting from an empty state."
            exit 0
          fi
          run_id="${row#*$'\t'}"
          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name test-qa-state \
            --dir "$RUNNER_TEMP/test-qa-previous"

      - name: Merge worker records
        run: |
          node scripts/agents/test-qa-state.mjs merge \
            --previous "$RUNNER_TEMP/test-qa-previous/state.json" \
            --output "$RUNNER_TEMP/test-qa-state"

      - name: Upload state artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-qa-state
          path: |
            ${{ runner.temp }}/test-qa-state/state.json
            ${{ runner.temp }}/test-qa-state/STATE.md
          if-no-files-found: error
          retention-days: 90
