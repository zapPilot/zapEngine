name: Temporary PostHog sync

on:
  push:
    branches:
      - feat/posthog-product-analytics

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/posthog-product-analytics
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Update canonical env inventory
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('config/env.manifest.mjs')
          text = manifest.read_text()
          needle = "  GA_ID: client(['landing-page'], { next: 'NEXT_PUBLIC_GA_ID' }),\n"
          if 'POSTHOG_KEY:' not in text:
              text = text.replace(
                  needle,
                  needle
                  + "  POSTHOG_KEY: client(['landing-page'], { next: 'NEXT_PUBLIC_POSTHOG_KEY' }),\n"
                  + "  POSTHOG_HOST: client(['landing-page'], { next: 'NEXT_PUBLIC_POSTHOG_HOST' }),\n",
                  1,
              )
          manifest.write_text(text)

          example = Path('.env.example')
          text = example.read_text()
          needle = 'GA_ID=\n'
          if 'POSTHOG_KEY=' not in text:
              text = text.replace(
                  needle,
                  needle
                  + '\n# Product behavior analytics. Leave the key empty to disable PostHog.\n'
                  + '# Set POSTHOG_HOST to the ingest host for the selected PostHog region.\n'
                  + 'POSTHOG_KEY=\n'
                  + 'POSTHOG_HOST=https://us.i.posthog.com\n',
                  1,
              )
          example.write_text(text)
      - name: Generate pnpm lockfile
        env:
          HUSKY: '0'
          PLAYWRIGHT_SKIP_INSTALL: '1'
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/env.manifest.mjs .env.example pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "chore: sync PostHog env and lockfile"
          git push origin HEAD:feat/posthog-product-analytics
