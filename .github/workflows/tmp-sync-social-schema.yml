name: Temporary Social Schema Sync

on:
  push:
    branches:
      - feat/social-native-video-brand-cta

permissions:
  contents: write

jobs:
  sync-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/social-native-video-brand-cta
          fetch-depth: 0
      - name: Patch canonical social schema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/podcast-pipeline/supabase/schema.sql')
          text = path.read_text()

          old_comment = "\n".join([
              "  -- Set only when the post itself carried the video (Rednote). X and Threads",
              "  -- publish a link whose target page has the video, so they stay null.",
          ])
          new_comment = "\n".join([
              "  -- Duration of the media actually delivered to the platform. Rednote always",
              "  -- carries video; X and Threads allow NULL for legacy/text-only rows.",
          ])
          old_constraint = "\n".join([
              "    or (",
              "      platform <> 'rednote'",
              "      and video_duration_sec is null",
              "    )",
          ])
          new_constraint = "\n".join([
              "    or (",
              "      platform <> 'rednote'",
              "      and (",
              "        video_duration_sec is null",
              "        or video_duration_sec > 0",
              "      )",
              "    )",
          ])

          if old_comment not in text:
              raise SystemExit('expected social video comment not found')
          if old_constraint not in text:
              raise SystemExit('expected social video constraint not found')

          text = text.replace(old_comment, new_comment, 1)
          text = text.replace(old_constraint, new_constraint, 1)
          path.write_text(text)
          PY
      - name: Commit schema sync
        run: |
          if git diff --quiet -- apps/podcast-pipeline/supabase/schema.sql; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/podcast-pipeline/supabase/schema.sql
          git commit -m "fix(db): sync native-video constraint in canonical schema"
          git push origin HEAD:feat/social-native-video-brand-cta
