name: Track Record Snapshot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-record-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The TRACK_RECORD_* values come from the environment rail, not from
    # repository secrets/variables: `pnpm build packages` and the snapshot
    # scripts all resolve them through config/env.manifest.mjs, and a
    # `secrets.*` mapping that is not configured arrives as an empty string
    # that overrides the injected value instead of falling back to it.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/setup-env-tooling

      - name: Build workspace packages
        run: pnpm build packages

      - name: Read previous CID
        run: |
          previous_cid="$(node -e "const meta=require('./apps/landing-page/public/track-record-meta.json'); process.stdout.write(meta.latestSnapshotCid || '')")"
          echo "TRACK_RECORD_PREVIOUS_CID=$previous_cid" >> "$GITHUB_ENV"

      - name: Generate signed snapshot
        run: |
          node scripts/env/run.mjs --environment prod -- \
            pnpm track-record:generate -- --out .track-record/daily-snapshot.json

      - name: Publish snapshot and update meta
        run: |
          node scripts/env/run.mjs --environment prod -- \
            pnpm track-record:publish -- --snapshot .track-record/daily-snapshot.json

      - name: Verify published chain
        run: node scripts/env/run.mjs --environment prod -- pnpm track-record:verify
        env:
          TRACK_RECORD_META_URL: file://${{ github.workspace }}/apps/landing-page/public/track-record-meta.json

      - name: Commit updated track record meta
        run: |
          if git diff --quiet -- apps/landing-page/public/track-record-meta.json; then
            echo "No track record meta changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/landing-page/public/track-record-meta.json
          git commit -m "Update daily track record snapshot"

          # The branch keeps advancing while this job runs (PR merges, sibling
          # crons), so replay the generated commit onto the current tip and push
          # fast-forward only. --autostash: `pnpm build packages` can leave
          # tracked design-token outputs modified, and rebase refuses a dirty
          # tree even when already up to date.
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            if ! git rebase --autostash "origin/$branch"; then
              echo "::error::Rebase onto origin/$branch failed (likely a concurrent change to track-record-meta.json); refusing to overwrite it."
              exit 1
            fi
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push rejected (attempt $attempt/3); refreshing $branch and retrying..."
              sleep 2
            fi
          done
          echo "::error::Failed to push track record meta after 3 attempts."
          exit 1
