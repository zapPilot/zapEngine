name: Track Record Snapshot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-record-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The TRACK_RECORD_* values come from the environment rail, not from
    # repository secrets/variables: `pnpm build packages` and the snapshot
    # scripts all resolve them through config/env.manifest.mjs, and a
    # `secrets.*` mapping that is not configured arrives as an empty string
    # that overrides the injected value instead of falling back to it.
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
      INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/setup-env-tooling

      - name: Build workspace packages
        run: pnpm build packages

      - name: Read previous CID
        run: |
          previous_cid="$(node -e "const meta=require('./apps/landing-page/public/track-record-meta.json'); process.stdout.write(meta.latestSnapshotCid || '')")"
          echo "TRACK_RECORD_PREVIOUS_CID=$previous_cid" >> "$GITHUB_ENV"

      - name: Generate signed snapshot
        run: |
          node scripts/env/run.mjs --environment prod -- \
            pnpm track-record:generate -- --out .track-record/daily-snapshot.json

      - name: Publish snapshot and update meta
        run: |
          node scripts/env/run.mjs --environment prod -- \
            pnpm track-record:publish -- --snapshot .track-record/daily-snapshot.json

      - name: Verify published chain
        run: node scripts/env/run.mjs --environment prod -- pnpm track-record:verify
        env:
          TRACK_RECORD_META_URL: file://${{ github.workspace }}/apps/landing-page/public/track-record-meta.json

      - name: Commit updated track record meta
        uses: ./.github/actions/commit-generated-artifacts
        with:
          paths: apps/landing-page/public/track-record-meta.json
          message: Update daily track record snapshot
