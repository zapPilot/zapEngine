appId: com.zapengine.zappilot
productName: Zap Pilot
directories:
  output: release

# Main/preload are esbuild-bundled CJS files under dist/ — no node_modules are
# packaged (avoids the pnpm-symlink/asar trap). The renderer is the app
# static web export shipped as an extraResource.
files:
  - dist/**
  - package.json
  - '!node_modules'
  # Source maps are built for local debugging and Sentry upload, never shipped:
  # they carry full sourcesContent for the app and every bundled dependency.
  - '!dist/**/*.map'

extraResources:
  - from: ../app/dist/web
    to: web
    filter:
      - '**/*'
      - '!**/*.map'

mac:
  category: public.app-category.finance
  icon: build/icon.icns
  target:
    - dmg
  # Unsigned for now; Developer ID signing + notarytool are a follow-up.
  identity: null

protocols:
  - name: Zap Pilot
    schemes:
      - zappilotv2
