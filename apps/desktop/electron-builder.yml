appId: com.zapengine.zappilot
productName: Zap Pilot
directories:
  output: release

# Main/preload are esbuild-bundled CJS files under dist/ — no node_modules are
# packaged (avoids the pnpm-symlink/asar trap). The renderer is the app
# static web export shipped as an extraResource.
files:
  - dist/**
  - package.json
  - '!node_modules'
  # Source maps are built for local debugging and Sentry upload, never shipped:
  # they carry full sourcesContent for the app and every bundled dependency.
  - '!dist/**/*.map'

extraResources:
  - from: ../app/dist/web
    to: web
    filter:
      - '**/*'
      - '!**/*.map'

forceCodeSigning: true
artifactName: Zap-Pilot-${os}-${arch}.${ext}
publish:
  provider: github
  owner: zapPilot
  repo: zapEngine
  releaseType: release
  tagNamePrefix: desktop-v

mac:
  category: public.app-category.finance
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  type: distribution
  identity: LP8CA4MT6U
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

protocols:
  - name: Zap Pilot
    schemes:
      - zappilotv2
