# fly.toml app configuration file generated for from-fed-to-chain-api on 2026-05-03T16:33:25+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'from-fed-to-chain-api'
# IAD is materially cheaper than NRT for both shared and performance Machines.
# The pipeline is queue-driven and stores media in R2/Supabase, so it does not
# require Tokyo-local compute latency.
primary_region = 'iad'
kill_signal = 'SIGINT'
# Ingest work is durable and can be reclaimed after a restart, so shutdown only
# needs a short grace window for HTTP drain and process cleanup rather than five
# minutes to finish an entire LLM/TTS ingest in place.
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

# Bluegreen is forbidden for this app. Fly clones every existing Machine into
# the green release, including stopped orphans, and a failed or cancelled deploy
# does not clean those clones up. It also starts every green render Machine,
# burning performance-2x capacity while the worker's 90-second idle exit races
# the deploy. Rolling updates the existing app and render Machines in place, so
# the fleet cannot multiply. Its short Telegram webhook gap is absorbed by
# Telegram retries and the durable ingest job/lease recovery path.
# This block only reaches Fly through `fly deploy --config`; nothing else writes
# the platform's stored config, so a fly.toml edit that is never deployed leaves
# the old strategy live. Verify with `flyctl config show --app <name>`.
[deploy]
  strategy = 'rolling'
  wait_timeout = '8m'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

# Two groups so ffmpeg never shares a CPU with the HTTP service. When they were
# co-located, a render starved the event loop until /health blew past its 5s
# timeout and Fly pulled the only instance out of the proxy pool
# ([PR01] no known healthy instances found for route tcp/443).
#
# `app` is always on: it takes the Telegram webhook and owns the lightweight
# durable completion-notification retry loop. `render` is on demand — it has no
# service, so Fly Proxy cannot auto-stop it; instead the worker exits 0 on an idle
# queue and `app` starts it again through the Machines API
# (src/services/render-capacity.ts). That is the group's only mode, so
# PIPELINE_FLY_API_TOKEN is the single setting it needs: it lives in Infisical
# prod and reaches Fly through the Environment apply workflow, which runs on a
# merge to main and on demand after a rotation
# (`gh workflow run env-apply.yml -f target=podcast-pipeline`). An `app` that
# boots on Fly without it fails outright — there is deliberately no second mode
# to fall back to, because a fallback nobody notices is what stopped renders for
# two days.
[processes]
  app = 'node --import ./dist/services/video-completion-notifier-autostart.js dist/index.js'
  render = 'node dist/worker.js'

# The whole on-demand scheme rests on this: exit 0 must leave the machine
# `stopped` rather than restart it into another idle loop. `on-failure` is also
# the Fly default, but it is far too load-bearing here to leave implicit.
[[restart]]
  policy = 'on-failure'
  processes = ['render']

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

# HTTP service plus ingest (LLM, TTS, audio HLS). Unchanged — audio work has
# always fit here.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

# Video rendering needs a dedicated CPU. A shared vCPU has a baseline of 1/16 of
# a core, and once the burst balance is spent x264 collapses. New renders use
# 720x1280 at 24fps, but performance CPU remains until production telemetry
# proves a smaller shape is cheaper per completed video.
#
# The renderer used to keep every supersampled scene image alive in one giant
# xfade graph; a production 54-scene render drove ffmpeg to ~3.6 GiB RSS and was
# OOM-killed on this 4 GB Machine. Portrait renders now encode at most eight
# supersampled scenes at a time, then compose those 720x640 chunk videos in a
# small final pass. `video:render-metrics` samples cgroup memory every 250 ms and
# reports `cgroupPeakObservedMb`, so 4 GB stays in place until production data
# proves a smaller memory or CPU shape is safe and cheaper per completed video.
[[vm]]
  size = 'performance-2x'
  memory = '4gb'
  processes = ['render']
