# fly.toml app configuration file generated for from-fed-to-chain-api on 2026-05-03T16:33:25+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'from-fed-to-chain-api'
primary_region = 'nrt'
kill_signal = 'SIGINT'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

# Two groups so ffmpeg never shares a CPU with the HTTP service. When they were
# co-located, a render starved the event loop until /health blew past its 5s
# timeout and Fly pulled the only instance out of the proxy pool
# ([PR01] no known healthy instances found for route tcp/443).
#
# `app` is always on: it takes the Telegram webhook, which times out easily.
# `render` is on demand — it has no service, so Fly Proxy cannot auto-stop it;
# instead the worker exits 0 on an idle queue and `app` starts it again through
# the Machines API (src/services/render-capacity.ts). Both behaviours are gated
# on PIPELINE_RENDER_ON_DEMAND + PIPELINE_FLY_API_TOKEN; without them the group
# stays up 24/7 as before.
[processes]
  app = 'node dist/index.js'
  render = 'node dist/worker.js'

# The whole on-demand scheme rests on this: exit 0 must leave the machine
# `stopped` rather than restart it into another idle loop. `on-failure` is also
# the Fly default, but it is far too load-bearing here to leave implicit.
[[restart]]
  policy = 'on-failure'
  processes = ['render']

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

# HTTP service plus ingest (LLM, TTS, audio HLS). Unchanged — audio work has
# always fit here.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

# Video rendering needs a dedicated CPU. A shared vCPU has a baseline of 1/16 of
# a core, and once the burst balance is spent x264 collapses — a production
# render was measured at speed=0.00434x, i.e. 25 minutes of wall clock for 6.6
# seconds of video, which no lease can outlast.
#
# The renderer also keeps dozens of decoded image inputs plus the xfade graph
# alive during the final pass, so peak memory scales with scene count (roughly
# one scene per 10s of narration). ffmpeg was OOM-killed at 1.73 GB against the
# old 2 GB limit, and that figure is a floor on the true peak, not the peak.
#
# The size stays generous because on-demand billing already removes the 24/7
# cost; trimming it would trade a small saving for the OOM this limit fixed.
[[vm]]
  size = 'performance-2x'
  memory = '4gb'
  processes = ['render']
