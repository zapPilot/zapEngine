auditConfig:
  ignoreGhsas:
    # Patched version unpublished upstream (extract-zip 2.0.2 never released)
    - GHSA-jmr9-qjv8-65gv
    # image-size 1.2.1 via metro 0.84.4 (expo 57, app build-time asset measuring only): 2.0.3+ now published upstream but metro pins 1.x and 2.x is ESM-only/breaking for its CJS require; clearing needs an Expo SDK/metro upgrade (owner decision). GitHub alerts 97, 98 stay open as owner/blocked; remove when metro supports image-size 2.x.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # No patched release: braces 3.0.3 is latest (via chokidar/micromatch), http-cache-semantics 4.2.0 (via got/@electron/get, build-time only), node-forge 1.4.0 (via @expo/cli). GitHub alerts stay open as owner/blocked; remove when patched releases exist.
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-ch52-4w7c-c8xp
    - GHSA-86w9-cpqp-85rv
    # No patched release: sprintf-js <=1.1.3 (via roarr/global-agent/electron-builder, desktop build-time only). Recommendation None, patched <0.0.0.
    - GHSA-hp3w-g68c-fv3c
    # No 6.x patched release: postcss-selector-parser 6.1.4 is latest 6.x (via tailwindcss 3.4.19/postcss-nested, app build-time only on trusted sources). Patched only in 7.1.6; tailwind v4 migration needs nativewind v5 RC. GitHub alert 136 stays open as owner/blocked; remove when 6.x is patched or app moves to tailwind v4.
    - GHSA-rj75-hqrm-r3gf
